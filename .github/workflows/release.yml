name: Release

# Builds the root Dockerfile and publishes it to GHCR whenever a version tag
# is pushed (see scripts/release.sh), or on demand via workflow_dispatch.
#
# linux/amd64 only: percival, the only host this image is deployed to, is
# amd64. Add another platform to the build-push-action `platforms:` input if
# that ever changes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lineleader/lineleader

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # {{raw}}, not {{version}}: {{version}} normalizes semver and
          # strips the leading `v`, publishing :0.1.0 for tag v0.1.0. The
          # homelab convention keeps the prefix (wall-e:v0.3.2,
          # random-motivation:v0.0.6), and scripts/release.sh and
          # deploy/percival/docker-compose.yml both reference :vX.Y.Z.
          # A `latest` tag is added too, via the default flavor latest=auto.
          tags: |
            type=semver,pattern={{raw}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
