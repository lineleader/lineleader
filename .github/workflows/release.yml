name: Release

# Builds the root Dockerfile and publishes it to GHCR whenever a version tag
# is pushed (see scripts/release.sh), or on demand via workflow_dispatch.
#
# linux/amd64 only: percival, the only host this image is deployed to, is
# amd64. Add another platform to the build-push-action `platforms:` input if
# that ever changes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lineleader/lineleader

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # type=semver on a `vX.Y.Z` tag push yields the semver tag itself
          # plus, by default (flavor latest=auto), a `latest` tag. On a
          # workflow_dispatch run with no tag ref, only `latest` applies.
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
