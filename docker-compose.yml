# Local development database stack for LineLeader.
#
# This file starts a throwaway Postgres instance for local development of the
# points ledger. It is NOT a deployment compose file — the real deployment lives
# in deploy/percival/docker-compose.yml, which pulls a published GHCR image,
# joins an existing shared Postgres on the `postgres` network, and publishes
# 8080 to the reverse proxy.
#
# The app itself is not a service here on purpose: run it on the host with
# `make dev` so rebuilds are instant and --insecure-cookies applies. The Postgres
# schema self-applies idempotently on boot (internal/ledger.Store applies it) —
# no migration step is needed.
#
# Usage:
#   docker compose up -d
#   LEDGER_DSN=postgres://postgres:dev@localhost:5432/lineleader?sslmode=disable \
#   AUTH_SECRET=devsecret \
#   make dev
#
# To clean up the database entirely (not just stop the container):
#   docker compose down -v
#
# Note: this is separate from `make test-db`, which runs a *throwaway* Postgres
# on port 5433 for the test suite.

name: lineleader-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lineleader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lineleader"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
