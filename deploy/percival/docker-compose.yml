# Deployment compose file for the `percival` homelab host, managed there by
# dockhand as a git-backed stack: dockhand polls this repo on a cron and
# redeploys when it sees a change (see scripts/release.sh and
# deploy/README.md). This file itself is not the version pin — the version
# comes from the sibling env file, deploy/percival/lineleader.env,
# committed alongside it and loaded by dockhand as the stack's env file.
#
# This pulls a published image from GHCR; nothing is built on percival.
# There is no postgres service here: this container joins the existing
# shared Postgres that already runs on percival (see the `postgresql`
# network below) and reaches it by container hostname. internal/ledger.Store
# applies any outstanding goose migrations automatically on boot — no
# separate migration step is needed here.

# Pin the project name: it otherwise defaults to the parent directory
# (`percival`), which would name the stack and its volume after the host
# rather than the app (`percival_state` instead of `lineleader_state`).
# This matters even more now that dockhand manages this as a git stack:
# the project name determines the named volume (`lineleader_state`), so
# it must stay `lineleader` for the existing volume to be reused across
# redeploys rather than orphaned.
name: lineleader

services:
  lineleader:
    # The deployed version comes from LINELEADER_VERSION, set in the
    # committed deploy/percival/lineleader.env and loaded by dockhand as
    # the stack's env file — rolling out a release means bumping that
    # file and pushing, not editing anything in the dockhand UI (see
    # deploy/README.md). This compose file never goes stale.
    #
    # Required form: an unset variable fails the deploy rather than
    # silently resolving to `:` (an invalid tag). Use ${LINELEADER_VERSION:-v0.1.1}
    # instead if you'd rather have a fallback default.
    #
    # Note the leading `v`: CI publishes v-prefixed tags (see
    # .github/workflows/release.yml), matching wall-e / random-motivation.
    image: ghcr.io/lineleader/lineleader:${LINELEADER_VERSION:?set LINELEADER_VERSION in deploy/percival/lineleader.env}
    restart: unless-stopped
    environment:
      # Host `postgresql` is the shared Postgres container's name on
      # percival (postgres:15.17), resolved by Docker DNS over the
      # `postgres` network joined below. Confirmed working end to end:
      # `psql postgres://casaos:casaos@postgresql:5432/...` connects from
      # inside that network.
      LEDGER_DSN: postgres://casaos:casaos@postgresql:5432/lineleader?sslmode=disable
      # Fail loud rather than silently start unauthenticated: dockhand must
      # set AUTH_SECRET in its own environment/secrets UI for this service.
      # It is NOT committed here — generate with `openssl rand -base64 32`
      # (see deploy/README.md).
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in dockhand}
    ports:
      # Caddy on the `traefik` tailnet node reverse-proxies lineleader.io
      # to percival:8080 (see deploy/Caddyfile.snippet) — this publishes
      # the port on the host for that proxy to reach.
      - "8080:8080"
      # Tighter alternative: bind only to percival's Tailscale IP, so the
      # app is reachable over the tailnet (which is all Caddy needs) but
      # not from the rest of the LAN. Swap for the line above to use it:
      # - "100.119.145.113:8080:8080"
    volumes:
      # config.json — the only state this container keeps outside Postgres.
      - state:/state
    # No healthcheck: the runtime image is distroless (no shell, no curl,
    # no wget) so there's nothing here to shell out to. GET /healthz is
    # checked from the outside instead, by the Caddy reverse proxy on the
    # `traefik` node.
    networks:
      - default
      - postgres

volumes:
  state:

networks:
  # The shared Postgres container on percival sits on a network called
  # `postgres` (singular) — note it does NOT match the container's own
  # name, `postgresql`. Confirmed via `docker network ls` on percival.
  postgres:
    external: true
